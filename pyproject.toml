[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k1s-core"
description = "Core Python runtime and compatibility CLIs for k1s"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "k1s contributors"}]
keywords = ["containers", "distributed-systems", "orchestration"]
dynamic = ["dependencies", "version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/the-cm-collective/k1s"
Repository = "https://github.com/the-cm-collective/k1s"
Documentation = "https://github.com/the-cm-collective/k1s/tree/main/docs"
Issues = "https://github.com/the-cm-collective/k1s/issues"
Changelog = "https://github.com/the-cm-collective/k1s/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "matplotlib>=3.9",
    "Pillow>=10.4",
    "pre-commit>=3.8",
    "jsonschema>=4.22",
    "huggingface_hub>=0.30",
]
watch = [
    "watchdog>=3.0",
]

[project.scripts]
ae = "ae.cli.__main__:main"
ae-rotate-certs = "ae.cli.rotate_certs:main"
k1s = "ae.kctl.__main__:main"
ae-node = "ae.node.server:main"
ae-gateway = "ae.gateway.__main__:main"
ae-worker-stub = "ae.worker_stub.__main__:main"

[tool.ae]
version_codename = "Snow Moon"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ae", "ae.*"]
namespaces = true

[tool.setuptools.package-data]
"ae.resources" = [
    "ingress/*.txt",
    "observability/*.html",
    "profiles/*.json",
    "sql/apishim/*.sql",
    "sql/controller/*.sql",
]
"ae.observability" = ["static/vendor/*.css", "static/vendor/*.js"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}
version = {attr = "ae.__version__"}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Unverified HTTPS request is being made.*:urllib3.exceptions.InsecureRequestWarning",
]
markers = [
    "integration: marks tests that require external dependencies or longer setup",
]

[tool.mypy]
python_version = "3.11"
packages = ["ae"]
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
