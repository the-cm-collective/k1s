[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae"
version = "0.1.5.dev0"
description = "Minimal application engine controller prototype"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [{name = "k1s contributors"}]
dynamic = ["dependencies"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "matplotlib>=3.9",
    "Pillow>=10.4",
    "pre-commit>=3.8",
    "jsonschema>=4.22",
]
watch = [
    "watchdog>=3.0",
]

[project.scripts]
ae = "ae.cli.__main__:main"
ae-rotate-certs = "ae.cli.rotate_certs:main"
k1s = "ae.kctl.__main__:main"
ae-node = "ae.node.server:main"
ae-gateway = "ae.gateway.__main__:main"
ae-worker-stub = "ae.worker_stub.__main__:main"

[tool.ae]
version_codename = "Snow Moon"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"ae.resources" = ["**/*.html", "**/*.md", "**/*.txt", "**/*.sql"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Unverified HTTPS request is being made.*:urllib3.exceptions.InsecureRequestWarning",
]
markers = [
    "integration: marks tests that require external dependencies or longer setup",
]

[tool.mypy]
python_version = "3.11"
packages = ["ae"]
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
