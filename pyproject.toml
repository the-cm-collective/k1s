[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae"
version = "0.1.0"
description = "Minimal application engine controller prototype"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "k1s contributors"}]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
watch = [
    "watchdog>=3.0",
]

[project.scripts]
ae = "ae.cli.__main__:main"
k1s = "ae.kctl.__main__:main"
ae-node = "ae.node.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.in"]}

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["ae"]
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
