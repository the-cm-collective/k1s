apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-parity-sticky-cookie
  namespace: default
  labels:
    app: k3s-parity-sticky-cookie
spec:
  replicas: 3
  selector:
    matchLabels:
      app: k3s-parity-sticky-cookie
  template:
    metadata:
      labels:
        app: k3s-parity-sticky-cookie
    spec:
      containers:
        - name: backend
          image: docker.io/python:3.12-slim
          command: ["python", "-u", "/opt/parity/deep_ingress_backend.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: backend-script
