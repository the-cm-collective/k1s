---
apiVersion: v1
kind: Service
metadata:
  name: k3s-parity-sticky-cookie
  namespace: default
  labels:
    app: k3s-parity-sticky-cookie
spec:
  selector:
    app: k3s-parity-sticky-cookie
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: k3s-parity-sticky-cookie
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`sticky-cookie-core-proxy.home.arpa`) && PathPrefix(`/id`)
      services:
        - kind: Service
          name: k3s-parity-sticky-cookie
          namespace: default
          port: 80
          nativeLB: true
          sticky:
            cookie:
              name: k1s_route
              httpOnly: true
              secure: true
  tls: {}
