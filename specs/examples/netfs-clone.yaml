apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-clone
provisioner: k1s.io/local-path
parameters:
  hostPath: /var/lib/ae/storage
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clone-src
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-clone
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clone-src-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clone-src-writer
  template:
    metadata:
      labels:
        app: clone-src-writer
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'hello clone' > /data/hello.txt; sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clone-src
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clone-dest
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-clone
  resources:
    requests:
      storage: 1Gi
  dataSourceRef:
    kind: PersistentVolumeClaim
    name: clone-src
    namespace: default
