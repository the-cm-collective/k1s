apiVersion: v1
kind: Namespace
metadata:
  name: k1s-system
---
apiVersion: v1
kind: Secret
metadata:
  name: k1s-agent-token
  namespace: k1s-system
type: Opaque
stringData:
  # Replace with your controller agent API token.
  token: changeme
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k1s-node
  namespace: k1s-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k1s-node
  namespace: k1s-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: k1s-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k1s-node
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: k1s-node
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      containers:
        - name: k1s-node
          image: registry.k1s.home.arpa:32000/k1s-node:latest
          imagePullPolicy: IfNotPresent
          args:
            - --runtime-backend
            - cri
            - --port
            - "9109"
          env:
            - name: AE_RUNTIME_BACKEND
              value: cri
            - name: AE_CRI_ENDPOINT
              value: unix:///run/containerd/containerd.sock
            - name: AE_CONTROLLER_URL
              value: http://k1s-controller.k1s-system.svc.cluster.local:9110
            - name: AE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: k1s-agent-token
                  key: token
            - name: AE_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: AE_AGENT_ENDPOINT
              value: http://$(NODE_IP):9109
            - name: AE_AGENT_HEARTBEAT_SECONDS
              value: "10"
            # Optional: enable on-node Service VIP/NodePort proxy (iptables).
            # Requires NET_ADMIN and root inside the pod.
            # - name: AE_AGENT_SERVICE_PROXY
            #   value: "1"
            # - name: AE_AGENT_SERVICE_PROXY_URL
            #   value: http://k1s-controller.k1s-system.svc.cluster.local:9110
            # - name: AE_AGENT_SERVICE_PROXY_DB
            #   value: /var/lib/ae/agent-services.db
            # - name: AE_AGENT_SERVICE_PROXY_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: k1s-api-read-token
            #       key: token
          ports:
            - name: agent
              containerPort: 9109
              hostPort: 9109
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            # Uncomment for iptables access when AE_AGENT_SERVICE_PROXY=1.
            # capabilities:
            #   add: ["NET_ADMIN"]
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: ae-data
              mountPath: /var/lib/ae
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: containerd-sock
          hostPath:
            # Access to the containerd socket is highly privileged; scope usage tightly.
            path: /run/containerd/containerd.sock
            type: Socket
        - name: ae-data
          hostPath:
            path: /var/lib/ae
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
