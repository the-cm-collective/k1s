apiVersion: ae.dev/v1alpha1
kind: App
metadata:
  name: echo
spec:
  image: alpine:3.20
  command:
    - sh
    - -c
    - "while true; do printf 'ready\n'; sleep 5; done"
  replicas: 1
  ports:
    - name: http
      containerPort: 8080
  health:
    readiness:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
  # Demonstrate configRefs projecting keys into env
  configRefs:
    - name: app-config
      path: configs/app-config.yaml
      env:
        - name: APP_MODE
          key: mode
        - name: APP_COLOR
          key: color
  # Manifest env overrides config/secret values if same key is present
  env:
    - name: APP_MODE
      value: demo-override
  secretRefs:
    - name: demo-secret
      path: specs/examples/demo-secret.sops.yaml
      env:
        - name: API_TOKEN
          key: token
      files:
        - key: token
          file: secret/token
  # Also project selected config keys to files
  configRefs:
    - name: app-config
      path: configs/app-config.yaml
      files:
        - key: mode
          file: config/app_mode.txt
