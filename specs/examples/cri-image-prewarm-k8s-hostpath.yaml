apiVersion: v1
kind: Namespace
metadata:
  name: k1s-prewarm
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cri-image-prewarm
  namespace: k1s-prewarm
spec:
  selector:
    matchLabels:
      app: cri-image-prewarm
  template:
    metadata:
      labels:
        app: cri-image-prewarm
    spec:
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      initContainers:
        - name: prewarm
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          env:
            - name: PREWARM_IMAGES
              value: "mendhak/http-https-echo:37"
            - name: CRI_ENDPOINT
              value: "unix:///run/containerd/containerd.sock"
            - name: TMPDIR
              value: /tmp
          command:
            - /bin/sh
            - -c
            - |
              set -e
              for img in $PREWARM_IMAGES; do
                echo "prewarm: $img"
                crictl --runtime-endpoint "$CRI_ENDPOINT" pull "$img"
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: crictl
              mountPath: /usr/local/bin/crictl
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
            - name: tmp
              mountPath: /tmp
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: crictl
          hostPath:
            # Adjust if crictl lives elsewhere (e.g., /usr/local/bin/crictl).
            path: /usr/bin/crictl
            type: File
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
            type: Socket
        - name: tmp
          emptyDir: {}
