apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: ingress-matrix-multiport
spec:
  image: docker.io/mendhak/http-https-echo:37
  replicas: 1
  ports:
    - name: http
      containerPort: 8080
    - name: metrics
      containerPort: 9090
  service:
    ports:
      - name: http
        port: 18114
        targetPort: 8080
      - name: metrics
        port: 19114
        targetPort: 9090
  nodeSelector:
    role: worker
    site: sea-edge-02
  health:
    readiness:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 1
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    liveness:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 3
      timeoutSeconds: 1
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
  resources:
    requests:
      cpu: 0.05
      memory: 128Mi
  security:
    runAsUser: 1000
    readOnlyRootFilesystem: true
    dropCapabilities: ["NET_RAW"]
    seccompProfileType: RuntimeDefault
