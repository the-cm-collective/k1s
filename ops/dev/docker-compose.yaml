services:
  caddy:
    image: docker.io/library/caddy:2.8
    ports:
      - "${CADDY_HTTP_PORT:-8888}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    env_file:
      - ../../state/dev.env
    volumes:
      - ./caddy:/etc/caddy:ro
      # Persist Caddy state (includes the local CA and issued certs)
      - ../../state/caddy-data:/data
      - ../../state/caddy:/etc/caddy/dynsites:ro
      - ../../docs/site:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    # Placeholder until controller writes per-app config.
  apishim:
    build:
      context: ../..
      dockerfile: ops/dev/apishim.Dockerfile
    working_dir: /workspace
    command: bash -lc "AE_APISHIM_ENABLE=1 python -m ae.apishim serve --host 0.0.0.0 --port 8445 --tls"
    volumes:
      - ../..:/workspace
      - ${APISHIM_CONTAINER_SOCKET:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock
    env_file:
      - ${APISHIM_ENV_FILE}
    environment:
      - AE_APISHIM_ENABLE=1
      - PYTHONPATH=/workspace/src
      - AE_APISHIM_RUNTIME=${AE_APISHIM_RUNTIME:-podman}
      - AE_APISHIM_ALLOW_ANON=0
      - AE_APISHIM_RBAC=1
      - AE_APISHIM_RBAC_EVAL=0
      - AE_NODE_ADVERTISE_IP=${APISHIM_NODE_ADVERTISE_IP:-}
      - AE_APISHIM_TLS_CERT=/workspace/${APISHIM_PROFILE_DIR}/apishim.crt
      - AE_APISHIM_TLS_KEY=/workspace/${APISHIM_PROFILE_DIR}/apishim.key
      - AE_APISHIM_DSN=${AE_APISHIM_DSN:-}
      - AE_APISHIM_DB=/workspace/${APISHIM_PROFILE_DIR}/apishim.db
      - AE_STORAGE_SEED_DEFAULTS=${AE_STORAGE_SEED_DEFAULTS:-}
      - AE_STORAGE_PROVISIONERS=${AE_STORAGE_PROVISIONERS:-}
      - AE_STORAGE_NFS_SERVER=${AE_STORAGE_NFS_SERVER:-}
      - AE_STORAGE_NFS_PATH=${AE_STORAGE_NFS_PATH:-}
      - AE_STORAGE_NFS_CLASS=${AE_STORAGE_NFS_CLASS:-}
      - AE_STORAGE_NFS_HOSTPATH=${AE_STORAGE_NFS_HOSTPATH:-}
      - AE_STATE_BACKEND=${AE_STATE_BACKEND:-}
      - AE_STATE_DSN=${AE_STATE_DSN:-}
      - AE_STATE_DB=${AE_STATE_DB:-}
      - AE_ETCD_ENDPOINTS=${AE_APISHIM_ETCD_ENDPOINTS:-${AE_ETCD_ENDPOINTS:-}}
      - AE_ETCD_PREFIX=${AE_ETCD_PREFIX:-}
      - CONTAINER_HOST=${APISHIM_CONTAINER_HOST:-unix:///run/podman/podman.sock}
    ports:
      - "127.0.0.1:${APISHIM_HOST_PORT:-${APISHIM_PORT:-8445}}:8445"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
  prometheus:
    image: docker.io/prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/prom-alerts-nats.yaml:/etc/prometheus/prom-alerts-nats.yaml:ro
      - ./prom-alerts-multinode.yaml:/etc/prometheus/prom-alerts-multinode.yaml:ro
    # Configure scrape targets after observability endpoints exist.

  haproxy:
    image: docker.io/library/haproxy:lts
    container_name: dev-haproxy
    ports:
      - "${HAPROXY_TCP_PORT:-9000}:9000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
