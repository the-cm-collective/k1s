services:
  caddy:
    image: caddy:2.8
    ports:
      - "${CADDY_HTTP_PORT:-8888}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    env_file:
      - ../../state/dev.env
    volumes:
      - ./caddy:/etc/caddy:ro
      # Persist Caddy state (includes the local CA and issued certs)
      - ../../state/caddy-data:/data
      - ../../state/caddy:/etc/caddy/dynsites:ro
      - ../../docs/site:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    # Placeholder until controller writes per-app config.
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Configure scrape targets after observability endpoints exist.

  haproxy:
    image: haproxy:lts
    container_name: dev-haproxy
    ports:
      - "${HAPROXY_TCP_PORT:-9000}:9000"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
