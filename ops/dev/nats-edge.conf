# Edge Leader NATS server (Core NATS only, Mode A). Dev defaults only.
# The leafnode uplink uses the hub's uplink credentials.

server_name: "edge-sfo-01"
port: 4223
http: 8223

leafnodes {
  remotes = [
    {
      url: "nats://site-sfo-edge-01-uplink:dev@nats-hub:7422"
    }
  ]
}

authorization {
  users: [
    {
      user: "gateway"
      password: "dev"
      permissions: {
        publish: [
          "k1s.v1.local.work.>",
          "k1s.v1.site.sfo-edge-01.>",
          "$JS.API.>",
          "$JS.API.STREAM.NAMES",
          "$JS.API.CONSUMER.MSG.NEXT.K1S_WORK.WORK_SITE_sfo-edge-01",
          "$JS.ACK.K1S_WORK.>"
        ]
        subscribe: [
          "k1s.v1.local.result",
          "k1s.v1.local.status.>",
          "k1s.v1.local.logs.>",
          "_INBOX.>"
        ]
      }
    },
    {
      user: "worker"
      password: "dev"
      permissions: {
        publish: [
          "k1s.v1.local.result",
          "k1s.v1.local.status.>",
          "k1s.v1.local.logs.>",
          "k1s.v1.local.node.announce.>"
        ]
        subscribe: ["k1s.v1.local.work.>"]
      }
    }
  ]
}
