services:
  controller:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -lc "python -m pip install -e .[watch] && AE_LABS=1 AE_API_MUTATIONS=1 python -m ae.controller --loop --specs specs --metrics-port 9108 --watch"
    volumes:
      - ../..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AE_LABS=1
      - AE_API_MUTATIONS=1
    ports:
      - "9108:9108"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  caddy:
    image: caddy:2.8
    depends_on:
      - controller
    ports:
      - "${CADDY_HTTP_PORT:-8888}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ../../state/caddy-data:/data
      - ../../state/caddy:/etc/caddy/dynsites:ro
      - ../../docs/site:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

