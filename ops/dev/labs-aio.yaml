services:
  controller:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -lc "python -m pip install -e .[watch] && AE_LABS=1 AE_API_MUTATIONS=1 AE_SPECS_DIR=${AE_SPECS_DIR:-state/demo-specs} python -m ae.controller --loop --specs \"${AE_SPECS_DIR:-state/demo-specs}\" --metrics-port 9108 --watch"
    volumes:
      - ../..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../../state/labs/apishim.env
    environment:
      - AE_LABS=1
      - AE_API_MUTATIONS=1
      - AE_LABS_HELM_SERVER=https://apishim:${APISHIM_PORT:-8445}
      - AE_APISHIM_MIRROR=1
      - AE_APISHIM_SOT=1
      # Local-only: allow plaintext secrets during dev/bench runs
      - AE_ALLOW_PLAINTEXT_SECRETS=1
      # Ensure new app containers join the compose network for fast, in-container probes
      - AE_DOCKER_NETWORK=dev_default
      - AE_DEMO_MODE=1
      - AE_SPECS_DIR=${AE_SPECS_DIR:-state/demo-specs}
      - AE_PROBE_LOOPBACK_FALLBACK=host.docker.internal
      - AE_APISHIM_DSN=${AE_APISHIM_DSN:-}
      - AE_STATE_DSN=${AE_STATE_DSN:-}
    ports:
      - "9108:9108"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  apishim:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -lc "python -m pip install -e . && AE_APISHIM_ENABLE=1 python -m ae.apishim serve --host 0.0.0.0 --port 8445 --tls"
    volumes:
      - ../..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../../state/labs/apishim.env
    environment:
      - AE_APISHIM_ENABLE=1
      - AE_APISHIM_RUNTIME=${AE_APISHIM_RUNTIME:-docker}
      - AE_APISHIM_ALLOW_ANON=0
      - AE_APISHIM_RBAC=1
      - AE_APISHIM_RBAC_EVAL=0
      - AE_APISHIM_SOT=1
      - AE_APISHIM_ADAPTER=0
      - AE_APISHIM_DSN=${AE_APISHIM_DSN:-}
      - AE_APISHIM_TLS_CERT=/workspace/state/labs/apishim.crt
      - AE_APISHIM_TLS_KEY=/workspace/state/labs/apishim.key
      - AE_STATE_DSN=${AE_STATE_DSN:-}
    ports:
      - "127.0.0.1:${APISHIM_PORT:-8445}:8445"
  caddy:
    image: caddy:2.8
    depends_on:
      - controller
    ports:
      - "${CADDY_HTTP_PORT:-8888}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    environment:
      - APISHIM_UPSTREAM=apishim:8445
    volumes:
      - ./caddy:/etc/caddy:ro
      - ../../state/caddy-data:/data
      - ../../state/caddy:/etc/caddy/dynsites:ro
      - ../../docs/site:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    image: postgres:16
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=shim
      - POSTGRES_PASSWORD=shim
      - POSTGRES_DB=shim
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../state/postgres:/var/lib/postgresql/data
