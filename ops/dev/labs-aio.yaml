services:
  controller:
    image: python:3.12-slim
    working_dir: /workspace
    command: bash -lc "python -m pip install -e .[watch] && AE_LABS=1 AE_API_MUTATIONS=1 AE_SPECS_DIR=${AE_SPECS_DIR:-state/demo-specs} python -m ae.controller --loop --specs \"${AE_SPECS_DIR:-state/demo-specs}\" --metrics-port 9108 --watch"
    volumes:
      - ../..:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AE_LABS=1
      - AE_API_MUTATIONS=1
      # Local-only: allow plaintext secrets during dev/bench runs
      - AE_ALLOW_PLAINTEXT_SECRETS=1
      # Ensure new app containers join the compose network for fast, in-container probes
      - AE_DOCKER_NETWORK=dev_default
      - AE_DEMO_MODE=1
      - AE_SPECS_DIR=${AE_SPECS_DIR:-state/demo-specs}
    ports:
      - "9108:9108"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  caddy:
    image: caddy:2.8
    depends_on:
      - controller
    ports:
      - "${CADDY_HTTP_PORT:-8888}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy:/etc/caddy:ro
      - ../../state/caddy-data:/data
      - ../../state/caddy:/etc/caddy/dynsites:ro
      - ../../docs/site:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
