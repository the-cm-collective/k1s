# Basic scrape config for local development.
# Note: Prometheus doesn't support a "server" block in YAML; web
# settings like listen address are configured via CLI flags. We keep
# the default 9090 from the Docker image and just define scrapes.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prom-alerts-nats.yaml
  - /etc/prometheus/prom-alerts-multinode.yaml

scrape_configs:
  - job_name: "placeholder"
    static_configs:
      - targets: ["localhost:9999"]
