version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ae-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    container_name: ae-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../docs/grafana/ae_dashboard.json:/var/lib/grafana/dashboards/ae_dashboard.json:ro
      - ../../docs/grafana/ae_rollout_ops.json:/var/lib/grafana/dashboards/ae_rollout_ops.json:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=light

  controller:
    image: ae/controller:dev
    container_name: ae-controller
    ports:
      - "9108:9108"
    environment:
      - AE_STATE_DB=/state/controller.db
    volumes:
      - ../../specs:/specs:ro
      - ../../state:/state
