# Hub NATS server (JetStream enabled, single-account Mode A).
# Dev defaults only. Replace credentials before production use.

server_name: "hub"
port: 4222
http: 8222

jetstream {
  store_dir: /data/jetstream
  domain: "K1S"
  max_mem_store: 256MB
  max_file_store: 2GB
}

leafnodes {
  port: 7422
}

accounts {
  SYS {
    users: [
      { user: "sys", password: "dev" }
    ]
  }
  K1S {
    jetstream: enabled
    users: [
      {
        user: "hub-controller"
        password: "dev"
        permissions: {
          publish: ["k1s.v1.work.site.>", "$JS.API.STREAM.>", "$JS.API.CONSUMER.>", "$JS.K1S.API.>", "_INBOX.>"]
          subscribe: ["k1s.v1.site.>", "_INBOX.>"]
        }
      },
      {
        user: "site-sfo-edge-01-uplink"
        password: "dev"
        permissions: {
          publish: [
            "k1s.v1.site.sfo-edge-01.>",
            "$JS.API.>",
            "$JS.K1S.API.>",
            "$JS.API.CONSUMER.MSG.NEXT.K1S_WORK.WORK_SITE_sfo-edge-01",
            "$JS.ACK.K1S_WORK.>"
          ]
          subscribe: ["_INBOX.>"]
        }
      }
    ]
  }
}

system_account: SYS
