# Minimal HAProxy config for dev L4 TCP load balancing
# - Listens on :9000 (mapped from ${HAPROXY_TCP_PORT:-9000} in compose)
# - Targets per-replica host ports exposed by the controller on 127.0.0.1
# Update the 'server' lines below to match your actual replica ports

global
  maxconn 1024

defaults
  mode tcp
  timeout connect 5s
  timeout client  30s
  timeout server  30s

frontend tcp_app
  bind *:9000
  default_backend app_be

backend app_be
  balance roundrobin
  # Replace these with the per-replica host ports from `ae status tcp-echo`
  # Example placeholder ports (edit as needed):
  server r1 127.0.0.1:49152 check
  server r2 127.0.0.1:49153 check

