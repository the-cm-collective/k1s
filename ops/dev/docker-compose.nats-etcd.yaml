services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - ../../state/etcd:/etcd-data

  nats-hub:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-hub.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
      - "7422:7422"
    volumes:
      - ./nats-hub.conf:/etc/nats/nats-hub.conf:ro
      - ../../state/nats-hub:/data
    depends_on:
      - etcd

  nats-edge:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-edge.conf"]
    ports:
      - "4223:4223"
      - "8223:8223"
    volumes:
      - ./nats-edge.conf:/etc/nats/nats-edge.conf:ro
    depends_on:
      - nats-hub
