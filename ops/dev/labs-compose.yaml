services:
  caddy:
    image: caddy:2.8
    ports:
      - "${CADDY_HTTP_PORT:-8888}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    env_file:
      - ../../state/dev.env
    volumes:
      - ./caddy:/etc/caddy:ro
      - ../../state/caddy-data:/data
      - ../../state/caddy:/etc/caddy/dynsites:ro
      - ../../docs/site:/srv/docs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "host.containers.internal:host-gateway"
    # Note: This compose stack serves docs (including playground). Run the controller on the host:
    #   AE_SPECS_DIR=state/profiles/labs/specs AE_LABS=1 python -m ae.controller --loop --metrics-port 9108 --specs "$AE_SPECS_DIR" --watch
    # The playground will talk to the host controller at http://127.0.0.1:9108.
