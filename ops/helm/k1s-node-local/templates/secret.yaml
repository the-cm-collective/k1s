{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k1s-node-local.agentTokenSecretName" . }}
  labels:
    {{- include "k1s-node-local.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.target.agentTokenSecretKey }}: {{ .Values.secret.agentToken | quote }}
{{- end }}
