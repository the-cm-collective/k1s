{{- if and .Values.auth.create (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k1s-core-ha.authSecretName" . }}
  labels:
    {{- include "k1s-core-ha.labels" . | nindent 4 }}
type: Opaque
stringData:
  agent-token: {{ .Values.auth.agentToken | quote }}
  rathole-token: {{ .Values.auth.ratholeToken | quote }}
  apishim-admin-token: {{ .Values.auth.apishimAdminToken | quote }}
  apishim-read-token: {{ .Values.auth.apishimReadToken | quote }}
  apishim-mint-token: {{ .Values.auth.apishimMintToken | quote }}
  apishim-session-secret: {{ .Values.auth.apishimSessionSecret | quote }}
  nats-controller-user: {{ .Values.auth.natsControllerUser | quote }}
  nats-controller-password: {{ .Values.auth.natsControllerPassword | quote }}
  nats-leaf-user: {{ .Values.auth.natsLeafUser | quote }}
  nats-leaf-password: {{ .Values.auth.natsLeafPassword | quote }}
{{- end }}
