name: apishim-ha-postgres

on:
  push:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/apishim-ha-postgres.yml"

jobs:
  ha-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: shim
          POSTGRES_USER: shim
          POSTGRES_DB: shim
        options: >-
          --health-cmd "pg_isready -U shim -d shim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Seed Postgres state
        env:
          PG_DSN: postgresql://shim:shim@localhost:5432/shim
        run: |
          set -euo pipefail
          python - <<'PY'
from ae.controller.state import SQLiteStateStore, ServiceEndpoint
s = SQLiteStateStore(dsn='postgresql://shim:shim@localhost:5432/shim')
s.upsert_service('default--echo', '10.96.0.77', {'8080': {'port': 8080, 'targetPort': 18080, 'protocol': 'TCP'}})
s.upsert_service_endpoints('default--echo', [ServiceEndpoint(app_name='default--echo', port=8080, ip='10.0.0.21', target_port=18080, ready=True)])
PY
      - name: Start apishim A
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-token"
          AE_APISHIM_DSN: postgresql://shim:shim@localhost:5432/shim
          AE_STATE_DSN: postgresql://shim:shim@localhost:5432/shim
          AE_RUNTIME_BACKEND: stub
          PYTHONPATH: src
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" >/tmp/apishim-a.log 2>&1 &
          echo $! >/tmp/apishim-a.pid
          sleep 3
      - name: Start apishim B
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-token"
          AE_APISHIM_DSN: postgresql://shim:shim@localhost:5432/shim
          AE_STATE_DSN: postgresql://shim:shim@localhost:5432/shim
          AE_RUNTIME_BACKEND: stub
          PYTHONPATH: src
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8446 --token "$AE_APISHIM_TOKEN" >/tmp/apishim-b.log 2>&1 &
          echo $! >/tmp/apishim-b.pid
          sleep 3
      - name: Create via shim A, watch via shim B (churn loop)
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          KA="kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify"
          KB="kubectl --server=http://127.0.0.1:8446 --token=$TOKEN --insecure-skip-tls-verify"
          $KB get configmaps -w --request-timeout=20s >/tmp/watch-b.log 2>&1 &
          W=$!
          for i in $(seq 1 8); do
            cat <<'YAML' >/tmp/cm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-cm
  namespace: default
data:
  k: v
YAML
            $KA apply -f /tmp/cm.yaml
            $KA patch configmap ha-cm --type=merge -p '{"data":{"k":"v'$i'"}}'
            sleep 1
          done
          kill $W || true
          grep -q "ha-cm" /tmp/watch-b.log
      - name: Restart shim A and verify persistence via shim B
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          if [ -f /tmp/apishim-a.pid ]; then kill $(cat /tmp/apishim-a.pid) || true; fi
          sleep 3
          K="kubectl --server=http://127.0.0.1:8446 --token=$TOKEN --insecure-skip-tls-verify"
          KVAL=$($K get configmap ha-cm -o jsonpath='{.data.k}')
          echo "val=$KVAL"
          [ -n "$KVAL" ]
      - name: Metrics from shim B show pg backend and enqueued events
        env:
          TOKEN: "ci-token"
        run: |
          METRICS=$(curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8446/metrics)
          echo "$METRICS" | grep 'apishim_store_backend_info{backend="postgres"}'
          echo "$METRICS" | grep 'apishim_watch_events_enqueued_total'
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== apishim-a ===" && cat /tmp/apishim-a.log || true
          echo "=== apishim-b ===" && cat /tmp/apishim-b.log || true
          echo "=== watch-b ===" && cat /tmp/watch-b.log || true
      - name: Stop shims
        if: always()
        run: |
          if [ -f /tmp/apishim-a.pid ]; then kill $(cat /tmp/apishim-a.pid) 2>/dev/null || true; fi
          if [ -f /tmp/apishim-b.pid ]; then kill $(cat /tmp/apishim-b.pid) 2>/dev/null || true; fi
