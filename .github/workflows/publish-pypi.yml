name: publish-python-pypi

on:
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Successful publish-python-testpypi workflow run ID
        required: true
        type: string
      source-sha:
        description: Exact source commit built by the TestPyPI workflow
        required: true
        type: string

concurrency:
  group: publish-python-pypi-${{ inputs.source-sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/k1s-core
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Verify source TestPyPI workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg sha "$SOURCE_SHA" \
            '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/publish-testpypi.yml"' \
            "$RUNNER_TEMP/source-run.json"
      - name: Check out the exact built source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download TestPyPI publication bundle without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source-run-id }}
          name: k1s-core-python-${{ inputs.source-sha }}
          path: bundle
      - name: Verify exact production publication bytes
        run: >-
          python scripts/validate_python_artifacts.py
          --dist bundle/dist
          --verify-manifest bundle/SHA256SUMS
      - name: Publish exact TestPyPI bytes to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: bundle/dist
