name: apishim-postgres

on:
  push:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/apishim-postgres.yml"

jobs:
  pg-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: shim
          POSTGRES_USER: shim
          POSTGRES_DB: shim
        options: >-
          --health-cmd "pg_isready -U shim -d shim" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Set Postgres connection
        run: |
          if [ "${ACT:-}" = "true" ] || [ -n "${GITEA_ACTIONS:-}" ]; then
            PG_HOST="postgres"
          else
            PG_HOST="localhost"
          fi
          echo "PG_HOST=$PG_HOST" >> "$GITHUB_ENV"
          echo "PG_DSN=postgresql://shim:shim@${PG_HOST}:5432/shim" >> "$GITHUB_ENV"
          echo "AE_APISHIM_DSN=postgresql://shim:shim@${PG_HOST}:5432/shim" >> "$GITHUB_ENV"
          echo "AE_STATE_DSN=postgresql://shim:shim@${PG_HOST}:5432/shim" >> "$GITHUB_ENV"
      - name: Wait for Postgres
        run: |
          python -c "import sys,textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PY'
          import os
          import time
          import psycopg

          dsn = os.environ["PG_DSN"]
          deadline = time.time() + 60
          last_error = None
          while time.time() < deadline:
              try:
                  with psycopg.connect(dsn) as conn:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                  print("Postgres ready")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Postgres not ready: {last_error}")
          PY
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Generate apishim TLS cert
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout /tmp/apishim-tls.key -out /tmp/apishim-tls.crt \
            -subj "/CN=127.0.0.1" -days 1 >/dev/null 2>&1
          echo "AE_APISHIM_TLS_CERT=/tmp/apishim-tls.crt" >> "$GITHUB_ENV"
          echo "AE_APISHIM_TLS_KEY=/tmp/apishim-tls.key" >> "$GITHUB_ENV"
      - name: Seed sqlite store and migrate to Postgres
        run: |
          set -euo pipefail
          python -c "import sys,textwrap; exec(textwrap.dedent(sys.stdin.read()))" <<'PY'
          from pathlib import Path
          from ae.apishim.store import ObjectStore
          src = ObjectStore(db_path=Path('/tmp/src.db'))
          src.upsert('', 'v1', 'configmaps', 'default', 'cm1', {'name':'cm1','namespace':'default'}, {'k':'v'})
          PY
          python -m ae.apishim migrate --source /tmp/src.db --target "$PG_DSN"
      - name: Start apishim against Postgres
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-token"
          AE_APISHIM_WATCH_QUEUE_SIZE: "1"
          AE_RUNTIME_BACKEND: stub
          PYTHONPATH: src
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" --tls >/tmp/apishim-pg.log 2>&1 &
          echo $! >/tmp/apishim.pid
          sleep 4
      - name: Validate migrated object and metrics
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          SERVER=https://127.0.0.1:8445
          K="kubectl --server=$SERVER --token=$TOKEN --insecure-skip-tls-verify"
          $K get configmaps
          # generate some churn and a slow watch to bump queue stats
          $K get configmaps -w --request-timeout=5s >/tmp/watch.log 2>&1 &
          W=$!
          for i in $(seq 1 20); do
            $K patch configmap cm1 --type=merge -p '{"data":{"k":"v'$i'"}}'
          done
          sleep 1
          kill $W || true
          METRICS=$(curl -kfsS -H "Authorization: Bearer $TOKEN" $SERVER/metrics)
          echo "$METRICS" | grep 'apishim_store_backend_info{backend="postgres"}'
          echo "$METRICS" | grep 'apishim_watch_events_enqueued_total'
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== apishim ===" && cat /tmp/apishim-pg.log || true
          echo "=== watch ===" && cat /tmp/watch.log || true
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
