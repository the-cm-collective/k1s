name: apishim-ssa-rbac

on:
  push:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/apishim-ssa-rbac.yml"

concurrency:
  group: port-8445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ssa-rbac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Prepare user bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
      - name: Generate apishim TLS cert
        run: |
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
            -keyout /tmp/apishim-tls.key -out /tmp/apishim-tls.crt \
            -subj "/CN=127.0.0.1" -days 1 >/dev/null 2>&1
          echo "AE_APISHIM_TLS_CERT=/tmp/apishim-tls.crt" >> "$GITHUB_ENV"
          echo "AE_APISHIM_TLS_KEY=/tmp/apishim-tls.key" >> "$GITHUB_ENV"
      - name: Start apishim (stub runtime with RBAC)
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-admin"
          AE_APISHIM_READ_TOKEN: "ci-read"
          AE_APISHIM_RBAC: "1"
          AE_APISHIM_RBAC_EVAL: "1"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" --tls >/tmp/apishim-ssa.log 2>&1 &
          echo $! >/tmp/apishim.pid
          sleep 3
      - name: RBAC can-i flow
        env:
          SERVER: "https://127.0.0.1:8445"
          ADMIN: "ci-admin"
          READ: "ci-read"
        run: |
          set -euo pipefail
          K="kubectl --server=$SERVER --insecure-skip-tls-verify"
          cat <<'YAML' >/tmp/rbac.yaml
          apiVersion: v1
          kind: Namespace
          metadata:
            name: default
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: cm-reader
            namespace: default
          rules:
          - apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: cm-reader-binding
            namespace: default
          subjects:
          - kind: User
            name: reader
            apiGroup: rbac.authorization.k8s.io
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: cm-reader
          YAML
          $K --token=$ADMIN apply -f /tmp/rbac.yaml
          $K --token=$READ auth can-i list configmaps | grep -qx "yes"
          $K --token=$READ auth can-i delete configmaps | grep -qx "no"
      - name: SSA + patch matrix
        env:
          SERVER: "https://127.0.0.1:8445"
          ADMIN: "ci-admin"
        run: |
          set -euo pipefail
          K="kubectl --server=$SERVER --insecure-skip-tls-verify --token=$ADMIN"
          cat <<'YAML' >/tmp/ssa-deploy.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ssa-demo
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ssa-demo
            template:
              metadata:
                labels:
                  app: ssa-demo
              spec:
                containers:
                - name: web
                  image: nginx:1.25
                  ports:
                  - containerPort: 80
          YAML
          $K apply --server-side --field-manager=manager-a -f /tmp/ssa-deploy.yaml
          set +e
          $K apply --server-side --field-manager=manager-b -f /tmp/ssa-deploy.yaml
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "expected SSA conflict without --force-conflicts" >&2
            exit 1
          fi
          $K apply --server-side --force-conflicts --field-manager=manager-b -f /tmp/ssa-deploy.yaml
          $K patch deploy ssa-demo --type=merge -p '{"spec":{"replicas":2}}'
          $K patch deploy ssa-demo --type=json -p '[{"op":"replace","path":"/spec/template/spec/containers/0/image","value":"nginx:1.26"}]'
          $K get deploy ssa-demo -o jsonpath='{.spec.replicas}' | grep -qx 2
          $K get deploy ssa-demo -o jsonpath='{.metadata.managedFields[*].manager}' | grep -q "manager-b"
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== apishim ===" && cat /tmp/apishim-ssa.log || true
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
