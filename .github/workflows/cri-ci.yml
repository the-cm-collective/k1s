name: cri-ci

on:
  push:
    branches: [ main, dev, feat/** ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  cri-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: "3.12"

      - name: Create venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install deps
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .[dev]

      - name: CRI setup
        if: ${{ env.ACT != 'true' }}
        run: sudo -E ./scripts/cri_ci_setup.sh

      - name: CRI integration tests
        if: ${{ env.ACT != 'true' }}
        env:
          AE_RUNTIME_BACKEND: cri
          AE_CRI_IT: "1"
          AE_CRI_SMOKE_PULL: "1"
          AE_CRI_ENDPOINT: unix:///run/containerd/containerd.sock
          AE_CRI_SANDBOX_IMAGE: registry.k8s.io/pause:3.9
        run: |
          sudo -E .venv/bin/python -m pytest \
            tests/integration/test_cri_smoke.py \
            tests/integration/test_cri_runtime_integration.py -q
