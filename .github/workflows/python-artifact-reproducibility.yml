name: python-artifact-reproducibility

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: python-artifact-reproducibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-artifact-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Prepare reviewed artifact prerequisites
        run: |
          python -m pip install \
            "build==1.2.2.post1" \
            "packaging==26.3" \
            "pyproject-hooks==1.3.3" \
            "setuptools==80.9.0" \
            "twine==6.2.0" \
            "wheel==0.45.1"
          python -m pip download \
            --only-binary=:all: \
            --require-hashes \
            --dest "$RUNNER_TEMP/k1s-core-wheelhouse" \
            -r requirements-release.lock
      - name: Build canonical artifacts under two umasks
        run: |
          set -euo pipefail
          evidence_parent="$RUNNER_TEMP/k1s-artifact-evidence"
          install -d -m 0700 "$evidence_parent"
          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          umask 022
          python scripts/build_python_artifacts.py build \
            --repository "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --tree "$source_tree" \
            --git "$(command -v git)" \
            --python "$(command -v python)" \
            --runtime-wheelhouse "$RUNNER_TEMP/k1s-core-wheelhouse" \
            --requirements-lock "$GITHUB_WORKSPACE/requirements-release.lock" \
            --output-root "$evidence_parent/umask-022" \
            --source-date-epoch 1793664000
          umask 077
          python scripts/build_python_artifacts.py build \
            --repository "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --tree "$source_tree" \
            --git "$(command -v git)" \
            --python "$(command -v python)" \
            --runtime-wheelhouse "$RUNNER_TEMP/k1s-core-wheelhouse" \
            --requirements-lock "$GITHUB_WORKSPACE/requirements-release.lock" \
            --output-root "$evidence_parent/umask-077" \
            --source-date-epoch 1793664000
          diff -qr \
            "$evidence_parent/umask-022/bundle" \
            "$evidence_parent/umask-077/bundle"
