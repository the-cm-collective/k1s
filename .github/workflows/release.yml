name: release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  shim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Install helm
        run: |
          curl -L https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          chmod +x /usr/local/bin/helm
      - name: Run helm shim smoke (stub runtime)
        env:
          RUNTIME: stub
          PYTHONPATH: src
        run: |
          bash scripts/helm_shim_demo.sh
      - name: Show shim logs on failure
        if: failure()
        run: |
          find /tmp -name "shim.log" -print -exec cat {} \;

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build wheels
        run: python -m build -w
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  openapi:
    runs-on: ubuntu-latest
    needs: shim-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Start apishim (stub) and export OpenAPI
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "release-token"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" >/tmp/apishim-openapi.log 2>&1 &
          echo $! >/tmp/apishim-openapi.pid
          sleep 3
          mkdir -p /tmp/openapi
          curl -fsS -H "Authorization: Bearer $AE_APISHIM_TOKEN" http://127.0.0.1:8445/openapi/v2 -o /tmp/openapi/openapi-v2.json
          curl -fsS -H "Authorization: Bearer $AE_APISHIM_TOKEN" http://127.0.0.1:8445/openapi/v3 -o /tmp/openapi/openapi-v3.json
      - name: Upload OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schemas
          path: /tmp/openapi/*
      - name: Release notes snippet
        run: |
          cat <<'EOF' >> $GITHUB_STEP_SUMMARY
          ## Release note attachments
          - Compatibility matrix: artifact **apishim-compatibility-matrix**
          - OpenAPI schemas: artifact **openapi-schemas** (contains openapi-v2.json and openapi-v3.json)
          EOF
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim-openapi.pid ]; then kill $(cat /tmp/apishim-openapi.pid) 2>/dev/null || true; fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build controller image
        run: docker build -f ops/images/controller.Dockerfile -t ae/controller:${{ github.ref_name }} .
      - name: Save image tar
        run: docker save ae/controller:${{ github.ref_name }} -o controller.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: controller-image
          path: controller.tar
      - name: Upload compatibility matrix
        uses: actions/upload-artifact@v4
        with:
          name: apishim-compatibility-matrix
          path: docs/apishim-compatibility-matrix.md
      # --- Optional: publish to GHCR (uncomment when ready) ---
      # - name: Login to GHCR
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      # - name: Tag and push
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     docker tag ae/controller:${{ github.ref_name }} ghcr.io/${{ github.repository }}/controller:${{ github.ref_name }}
      #     docker push ghcr.io/${{ github.repository }}/controller:${{ github.ref_name }}
