name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server-guard:
    if: ${{ github.server_url != 'https://github.com' || env.ACT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm supported actions host
        run: echo "Running release on ${GITHUB_SERVER_URL:-unknown}"

  validate-release:
    needs: server-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trust Gitea cert for checkout
        run: |
          if [ "${ACT:-}" = "true" ] && [ "${GITEA_ACTIONS:-}" != "true" ]; then
            exit 0
          fi
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslVerify true
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
            echo "GIT_SSL_NO_VERIFY=" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
            echo "GIT_SSL_CAINFO=" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v3
      - name: Bootstrap local act venv
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          source scripts/ci/lib.sh
          ci_bootstrap_act_venv
      - name: Set up Python
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Normalize runner env
        run: |
          source scripts/ci/lib.sh
          ci_maybe_trust_gitea
          ci_prepare_user_bin
      - name: Install project
        run: |
          source scripts/ci/lib.sh
          ci_install_project ".[dev]"
      - name: Validate release metadata
        run: python scripts/check_versioning.py --require-changelog
      - name: Validate OpenAPI snapshots
        run: scripts/validate-openapi.sh

  build-wheel:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Trust Gitea cert for checkout
        run: |
          if [ "${ACT:-}" = "true" ] && [ "${GITEA_ACTIONS:-}" != "true" ]; then
            exit 0
          fi
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslVerify true
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
            echo "GIT_SSL_NO_VERIFY=" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
            echo "GIT_SSL_CAINFO=" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v3
      - name: Bootstrap local act venv
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          source scripts/ci/lib.sh
          ci_bootstrap_act_venv
      - name: Set up Python
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build
      - name: Build wheels
        run: python -m build -w
      - name: Upload wheels
        uses: actions/upload-artifact@v3
        with:
          name: wheels
          path: dist/*.whl

  build-controller-image:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Trust Gitea cert for checkout
        run: |
          if [ "${ACT:-}" = "true" ] && [ "${GITEA_ACTIONS:-}" != "true" ]; then
            exit 0
          fi
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslVerify true
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
            echo "GIT_SSL_NO_VERIFY=" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
            echo "GIT_SSL_CAINFO=" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v3
      - name: Normalize runner env
        run: |
          source scripts/ci/lib.sh
          ci_maybe_trust_gitea
          ci_configure_docker_env
      - name: Build controller image
        run: docker build -f ops/images/controller.Dockerfile -t ae/controller:${{ github.ref_name }} .
      - name: Save image tar
        run: docker save ae/controller:${{ github.ref_name }} -o controller.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: controller-image
          path: controller.tar

  package-openapi-artifacts:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Trust Gitea cert for checkout
        run: |
          if [ "${ACT:-}" = "true" ] && [ "${GITEA_ACTIONS:-}" != "true" ]; then
            exit 0
          fi
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslVerify true
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
            echo "GIT_SSL_NO_VERIFY=" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
            echo "GIT_SSL_CAINFO=" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v3
      - name: Stage release artifacts
        run: |
          mkdir -p /tmp/release-artifacts/openapi
          cp docs/openapi/openapi-v2.json /tmp/release-artifacts/openapi/
          cp docs/openapi/openapi-v3.json /tmp/release-artifacts/openapi/
          cp docs/reference/apishim-compatibility-matrix.md /tmp/release-artifacts/
      - name: Upload OpenAPI schemas
        uses: actions/upload-artifact@v3
        with:
          name: openapi-schemas
          path: /tmp/release-artifacts/openapi/*
      - name: Upload compatibility matrix
        uses: actions/upload-artifact@v3
        with:
          name: apishim-compatibility-matrix
          path: /tmp/release-artifacts/apishim-compatibility-matrix.md
