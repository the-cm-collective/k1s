name: multinode-smoke

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "ops/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "requirements*.txt"

jobs:
  multinode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run multinode smoke tests
        run: |
          pytest tests/integration/test_multinode_agent_flow.py tests/integration/test_overlay_vip.py
