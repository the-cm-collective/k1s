name: multinode-smoke

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "ops/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "requirements*.txt"

jobs:
  multinode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - name: Configure Docker client (insecure TLS fallback)
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_VERIFY=0" >> "$GITHUB_ENV"
            echo "DOCKER_CERT_PATH=" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_CERTDIR=" >> "$GITHUB_ENV"
          elif [ -d /certs/client ]; then
            echo "DOCKER_HOST=tcp://docker:2376" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_VERIFY=0" >> "$GITHUB_ENV"
            echo "DOCKER_CERT_PATH=/certs/client" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_CERTDIR=" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run multinode smoke tests
        run: |
          pytest tests/integration/test_multinode_agent_flow.py tests/integration/test_overlay_vip.py tests/integration/test_apishim_persistence.py

  multinode-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Install kind & kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Run host-based 2-node smoke (controller + 2 agents)
        env:
          AE_TOKEN: ci-token
        run: |
          set -euo pipefail
          # Start controller
          AE_ENABLE_SERVICE_PROXY=0 \
          AE_AGENT_API_PORT=9110 \
          AE_AGENT_API_TOKEN=REDACTED"controller pid=$CTRL_PID"
          sleep 2
          # Start two agents on distinct ports
          AE_CONTROLLER_URL=http://127.0.0.1:9110 AE_AGENT_TOKEN=$AE_TOKEN AE_NODE_ID=node-a AE_NODE_LABELS=role=worker AE_AGENT_ENDPOINT=http://127.0.0.1:19109 python -m ae.node --runtime-backend docker --host 127.0.0.1 --port 19109 > /tmp/agent-a.log 2>&1 &
          A_PID=$!
          AE_CONTROLLER_URL=http://127.0.0.1:9110 AE_AGENT_TOKEN=$AE_TOKEN AE_NODE_ID=node-b AE_NODE_LABELS=role=worker AE_AGENT_ENDPOINT=http://127.0.0.1:19110 python -m ae.node --runtime-backend docker --host 127.0.0.1 --port 19110 > /tmp/agent-b.log 2>&1 &
          B_PID=$!
          sleep 5
          # Apply sample app and wait for readiness
          python -m ae.cli apply -f specs/examples/echo-multinode.yaml
          python -m ae.cli status echo-mn --watch 120 --timeout 180
          python -m ae.cli events echo-mn | tail -n 20
          # Cleanup
          kill $A_PID $B_PID $CTRL_PID || true
