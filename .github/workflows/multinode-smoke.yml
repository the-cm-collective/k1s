name: multinode-smoke

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "ops/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "requirements*.txt"

jobs:
  multinode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Run multinode smoke tests
        run: |
          pytest tests/integration/test_multinode_agent_flow.py tests/integration/test_overlay_vip.py

  multinode-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Install kind & kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Create 2-node kind cluster
        run: |
          cat > kind.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          EOF
          kind create cluster --config kind.yaml
      - name: Run overlay VIP smoke (kind placeholder)
        run: |
          echo "TODO: integrate controller/agent pods; placeholder to keep job green"
