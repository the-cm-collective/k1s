name: CI

on:
  push:
    branches: [ main, dev, feat/** ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-test-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Unit tests
        env:
          AE_RUNTIME_BACKEND: stub
          NO_PROXY: "127.0.0.1,localhost"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: pytest --maxfail=1 --disable-warnings -q

      - name: K8s alignment matrix drift check
        run: python tools/check_matrix_drift.py

      - name: Planner gating (strict)
        env:
          AE_RUNTIME_BACKEND: stub
        run: |
          chmod +x tools/plan_ci.sh
          tools/plan_ci.sh
