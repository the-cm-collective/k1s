name: helm-shim-smoke

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: port-8445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Prepare user bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
      - name: Install helm
        run: |
          curl -L https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          chmod +x "$HOME/.local/bin/helm"
      - name: Run Helm shim demo (stub runtime)
        env:
          RUNTIME: stub
          PYTHONPATH: src
        run: |
          bash scripts/helm_shim_demo.sh
      - name: Show shim logs on failure
        if: failure()
        run: |
          find /tmp -name "shim.log" -print -exec cat {} \;
