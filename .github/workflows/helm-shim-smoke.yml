name: helm-shim-smoke

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: port-8445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Prepare user bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
      - name: Install helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          for url in \
            https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz \
            https://storage.googleapis.com/kubernetes-helm/helm-v3.14.4-linux-amd64.tar.gz; do
            if curl -fL --retry 5 --retry-delay 2 --retry-connrefused "$url" -o /tmp/helm.tgz; then
              break
            fi
          done
          if [ ! -s /tmp/helm.tgz ]; then
            echo "failed to download helm after retries" >&2
            exit 1
          fi
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          chmod +x "$HOME/.local/bin/helm"
      - name: Start apishim (stub runtime)
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_ALLOW_ANON: "1"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
          NO_PROXY: "127.0.0.1,localhost"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --allow-anonymous >/tmp/apishim-helm.log 2>&1 &
          echo $! >/tmp/apishim.pid
          sleep 3
      - name: Run Helm shim demo (stub runtime)
        env:
          APISHIM_SERVER: "http://127.0.0.1:8445"
          RUNTIME: stub
          AE_APISHIM_ALLOW_ANON: "1"
          HELM_SHIM_SMOKE_TEMPLATE_ONLY: "1"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
          TOKEN: "helm-demo"
          PYTHONPATH: src
        run: |
          bash scripts/ci/helm-shim-smoke.sh
      - name: Show shim logs on failure
        if: failure()
        run: |
          find /tmp -name "shim.log" -print -exec cat {} \;
          echo "=== apishim ===" && cat /tmp/apishim-helm.log || true
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
