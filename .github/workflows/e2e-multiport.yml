name: e2e-multiport

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      AE_RUNTIME_BACKEND: docker
      DOCKER_BUILDKIT: 1
      CADDY_HTTPS_PORT: 8443
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'setup.cfg', 'setup.py', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps (age, sops)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y age sops

      - name: Install project deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run E2E (multiport)
        run: make e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          echo "== docker compose ps ==" > artifacts/stack-ps.txt || true
          docker compose -f ops/dev/docker-compose.yaml ps >> artifacts/stack-ps.txt || true
          docker compose -f ops/dev/docker-compose.yaml logs --no-color > artifacts/stack-logs.txt || true
          # Copy controller state snippets if present
          if [ -f state/controller.db ]; then cp state/controller.db artifacts/controller.db || true; fi
          if [ -d state/caddy ]; then tar -czf artifacts/caddy-state.tgz -C state caddy || true; fi

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-multiport-artifacts
          path: artifacts
