name: e2e-multiport-legacy

on:
  workflow_dispatch: {}

concurrency:
  group: e2e-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      AE_RUNTIME_BACKEND: docker
      DOCKER_BUILDKIT: 1
      CADDY_HTTPS_PORT: 8443
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - name: Configure Docker client (insecure TLS fallback)
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_VERIFY=0" >> "$GITHUB_ENV"
            echo "DOCKER_CERT_PATH=" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_CERTDIR=" >> "$GITHUB_ENV"
          elif [ -d /certs/client ]; then
            echo "DOCKER_HOST=tcp://docker:2376" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_VERIFY=0" >> "$GITHUB_ENV"
            echo "DOCKER_CERT_PATH=/certs/client" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_CERTDIR=" >> "$GITHUB_ENV"
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'setup.cfg', 'setup.py', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps (age, sops)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y age sops

      - name: Install project deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run E2E (multiport)
        run: make e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          echo "== docker compose ps ==" > artifacts/stack-ps.txt || true
          docker compose -f ops/dev/docker-compose.yaml ps >> artifacts/stack-ps.txt || true
          docker compose -f ops/dev/docker-compose.yaml logs --no-color > artifacts/stack-logs.txt || true
          # Copy controller state snippets if present
          if [ -f state/controller.db ]; then cp state/controller.db artifacts/controller.db || true; fi
          if [ -d state/caddy ]; then tar -czf artifacts/caddy-state.tgz -C state caddy || true; fi

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-multiport-artifacts
          path: artifacts
