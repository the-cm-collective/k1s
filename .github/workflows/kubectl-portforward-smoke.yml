name: kubectl-portforward-smoke

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: port-8445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portforward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_PROXY: "127.0.0.1,localhost"
      no_proxy: "127.0.0.1,localhost"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
          fi
      - uses: actions/checkout@v3
        env:
          GIT_SSL_NO_VERIFY: "true"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Prepare user bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
      - name: Start host echo server
        run: |
          python -m http.server 8081 >/tmp/echo-server.log 2>&1 &
          echo $! >/tmp/echo-server.pid
      - name: Start apishim (stub runtime)
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_ALLOW_ANON: "1"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --allow-anonymous >/tmp/apishim-ci.log 2>&1 &
          echo $! >/tmp/apishim.pid
          sleep 3
      - name: Apply manifest (skip validation)
        run: |
          cat <<'YAML' > /tmp/pf-deploy.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: pf-echo
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: pf-echo
            template:
              metadata:
                labels:
                  app: pf-echo
              spec:
                containers:
                - name: web
                  image: nginx:1.25-alpine
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: pf-echo
          spec:
            selector:
              app: pf-echo
            ports:
            - port: 80
              targetPort: 80
          YAML
          kubectl --server=http://127.0.0.1:8445 --insecure-skip-tls-verify --validate=false apply -f /tmp/pf-deploy.yaml
      - name: Port-forward and curl
        run: |
          kubectl --server=http://127.0.0.1:8445 --insecure-skip-tls-verify port-forward deploy/pf-echo 18080:80 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:18080 >/dev/null
          kill $PF_PID || true
      - name: Show logs on failure
        if: failure()
        run: |
          echo \"=== apishim ===\" && cat /tmp/apishim-ci.log || true
          echo \"=== port-forward ===\" && cat /tmp/pf.log || true
          echo \"=== echo-server ===\" && cat /tmp/echo-server.log || true
      - name: Stop shim/server
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
          if [ -f /tmp/echo-server.pid ]; then kill $(cat /tmp/echo-server.pid) 2>/dev/null || true; fi
