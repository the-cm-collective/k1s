name: apishim-smoke

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: port-8445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
          fi
      - uses: actions/checkout@v3
        env:
          GIT_SSL_NO_VERIFY: "true"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Prepare user bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
      - name: Start apishim (stub runtime)
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_ALLOW_ANON: "1"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
          NO_PROXY: "127.0.0.1,localhost"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --allow-anonymous >/tmp/apishim-ci.log 2>&1 &
          echo $! > /tmp/apishim.pid
          sleep 3
      - name: kubectl apply + get
        run: |
          export NO_PROXY="127.0.0.1,localhost"
          export HTTP_PROXY=""
          export HTTPS_PROXY=""
          cat <<'YAML' | kubectl --server=http://127.0.0.1:8445 --insecure-skip-tls-verify --validate=false apply --dry-run=server -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: shimdemo
            namespace: default
          data:
            hello: world
          YAML
          kubectl --server=http://127.0.0.1:8445 --insecure-skip-tls-verify get configmap shimdemo -o yaml
      - name: Show shim logs on failure
        if: failure()
        run: cat /tmp/apishim-ci.log
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
