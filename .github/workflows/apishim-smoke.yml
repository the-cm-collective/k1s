name: apishim-smoke

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: port-8445-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
          fi
      - uses: actions/checkout@v3
        env:
          GIT_SSL_NO_VERIFY: "true"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Prepare user bin path
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
      - name: Start apishim (stub runtime)
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-token"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" >/tmp/apishim-ci.log 2>&1 &
          echo $! > /tmp/apishim.pid
          sleep 3
      - name: kubectl apply + get
        env:
          TOKEN: "ci-token"
        run: |
          cat <<'YAML' | kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify --validate=false apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: shimdemo
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: shimdemo
            template:
              metadata:
                labels:
                  app: shimdemo
              spec:
                containers:
                  - name: web
                    image: nginx:1.25-alpine
                    ports:
                      - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: shimdemo
          spec:
            type: ClusterIP
            selector:
              app: shimdemo
            ports:
              - name: http
                port: 80
                targetPort: 80
          YAML
          kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify get deploy shimdemo -o wide
          kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify get svc shimdemo -o wide
          kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify get endpoints shimdemo -o yaml || true
      - name: Show shim logs on failure
        if: failure()
        run: cat /tmp/apishim-ci.log
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
