name: multinode-svc-portforward

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/multinode-svc-portforward.yml"

jobs:
  svc-portforward:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Start loopback backends
        run: |
          set -euo pipefail
          cat > /tmp/backend.py <<'PY'
import http.server, socketserver, threading, sys
bind_ip, port, body = sys.argv[1], int(sys.argv[2]), sys.argv[3].encode()
class Handler(http.server.BaseHTTPRequestHandler):
    def do_GET(self):
        self.send_response(200)
        self.send_header("Content-Type", "text/plain")
        self.end_headers()
        self.wfile.write(body)
    def log_message(self, *args): ...
def run():
    with socketserver.TCPServer((bind_ip, port), Handler) as httpd:
        httpd.serve_forever()
t = threading.Thread(target=run, daemon=True)
t.start()
PY
          python /tmp/backend.py 127.0.0.2 18080 "A" >/tmp/backend-a.log 2>&1 &
          echo $! >/tmp/backend-a.pid
          python /tmp/backend.py 127.0.0.3 18080 "B" >/tmp/backend-b.log 2>&1 &
          echo $! >/tmp/backend-b.pid
          sleep 1
      - name: Seed state DB with service endpoints
        env:
          AE_STATE_DB: /tmp/ctrl.db
        run: |
          python - <<'PY'
from ae.controller.state import SQLiteStateStore, ServiceEndpoint
store = SQLiteStateStore("/tmp/ctrl.db")
store.upsert_service("default--echo-svc", "10.96.0.50", {"8080": {"port": 8080, "targetPort": 18080, "protocol": "TCP"}})
store.upsert_service_endpoints("default--echo-svc", [
    ServiceEndpoint(app_name="default--echo-svc", port=8080, ip="127.0.0.2", target_port=18080, ready=True),
    ServiceEndpoint(app_name="default--echo-svc", port=8080, ip="127.0.0.3", target_port=18080, ready=True),
])
PY
      - name: Start apishim (stub runtime) using seeded state
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-token"
          AE_APISHIM_DB: /tmp/apishim.db
          AE_STATE_DB: /tmp/ctrl.db
          AE_APISHIM_RUNTIME: stub
          PYTHONPATH: "src"
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" >/tmp/apishim.log 2>&1 &
          echo $! >/tmp/apishim.pid
          sleep 3
      - name: Apply service manifest via kubectl
        env:
          TOKEN: "ci-token"
        run: |
          cat <<'YAML' >/tmp/echo-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: echo-svc
  namespace: default
spec:
  selector:
    app: echo-svc
  ports:
  - port: 8080
    targetPort: 18080
    protocol: TCP
YAML
          kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify --validate=false apply -f /tmp/echo-svc.yaml
      - name: Assert service status and ingress projection
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          K="kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify"
          CLUSTER_IP=$($K get svc echo-svc -o jsonpath='{.spec.clusterIP}')
          LB_IP=$($K get svc echo-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "clusterIP=${CLUSTER_IP} lb_ip=${LB_IP}"
          [ "$CLUSTER_IP" = "10.96.0.50" ] || (echo "unexpected clusterIP $CLUSTER_IP" && exit 1)
          [ "$LB_IP" = "10.96.0.50" ] || (echo "unexpected loadBalancer ip $LB_IP" && exit 1)
          cat <<'YAML' >/tmp/echo-ing.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo
  namespace: default
spec:
  defaultBackend:
    service:
      name: echo-svc
      port:
        number: 8080
YAML
          $K apply -f /tmp/echo-ing.yaml
          ING_IP=$($K get ingress echo -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "ingress ip=${ING_IP}"
          [ "$ING_IP" = "10.96.0.50" ]
      - name: Watch stability (svc)
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify get svc echo-svc -w --output-watch-events --request-timeout=8s > /tmp/svc-watch.log
          if ! [ -s /tmp/svc-watch.log ]; then
            echo "watch stream was empty"
            exit 1
          fi
      - name: Port-forward service twice and assert backends alternate
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          hit() {
            kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify port-forward svc/echo-svc 18081:8080 >/tmp/pf.log 2>&1 &
            PF_PID=$!
            sleep 2
            BODY=$(curl -fsS http://127.0.0.1:18081)
            kill $PF_PID || true
            echo "$BODY"
          }
          first=$(hit)
          second=$(hit)
          echo "first=$first second=$second"
          if [ "$first" = "$second" ]; then
            echo "expected different backends via round-robin, got $first twice"
            exit 1
          fi
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== apishim ===" && cat /tmp/apishim.log || true
          echo "=== pf ===" && cat /tmp/pf.log || true
          echo "=== backend-a ===" && cat /tmp/backend-a.log || true
          echo "=== backend-b ===" && cat /tmp/backend-b.log || true
      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/apishim.pid) 2>/dev/null || true
          kill $(cat /tmp/backend-a.pid) 2>/dev/null || true
          kill $(cat /tmp/backend-b.pid) 2>/dev/null || true
          rm -f /tmp/ctrl.db /tmp/apishim.db
