name: apishim-live-openapi

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  live-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: local
            runtime: stub
          - target: local
            runtime: docker
          - target: external
            runtime: stub
    if: >-
      ${{
        matrix.target == 'local' ||
        secrets.APISHIM_LIVE_KUBECONFIG_B64 != '' ||
        vars.APISHIM_KIND_CLUSTER != ''
      }}
    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: shim
          POSTGRES_USER: shim
          POSTGRES_DB: shim
        options: >-
          --health-cmd "pg_isready -U shim -d shim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NO_PROXY: "127.0.0.1,localhost"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      AE_APISHIM_DSN: postgresql://shim:shim@localhost:5432/shim
      AE_STATE_DSN: postgresql://shim:shim@localhost:5432/shim
      APISHIM_LIVE_ARTIFACT_DIR: /tmp/apishim-live
      APISHIM_LIVE_RUNTIME: ${{ matrix.runtime }}
      APISHIM_LIVE_TOKEN: live-ci
      APISHIM_LIVE_NAMESPACE: apishim-live
      APISHIM_KIND_CLUSTER: ${{ matrix.target == 'external' && vars.APISHIM_KIND_CLUSTER || '' }}
      APISHIM_LIVE_KUBECONFIG_B64: ${{ matrix.target == 'external' && secrets.APISHIM_LIVE_KUBECONFIG_B64 || '' }}
      KUBECONFIG_B64: ${{ matrix.target == 'external' && secrets.KUBECONFIG_B64 || '' }}
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
          fi
      - uses: actions/checkout@v3
        env:
          GIT_SSL_NO_VERIFY: "true"
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install helm
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          for url in \
            https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz \
            https://storage.googleapis.com/kubernetes-helm/helm-v3.14.4-linux-amd64.tar.gz; do
            if curl -fL --retry 5 --retry-delay 2 --retry-connrefused "$url" -o /tmp/helm.tgz; then
              break
            fi
          done
          if [ ! -s /tmp/helm.tgz ]; then
            echo "failed to download helm after retries" >&2
            exit 1
          fi
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm "$HOME/.local/bin/helm"
          chmod +x "$HOME/.local/bin/helm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install kind (optional)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -Lo "$HOME/.local/bin/kind" https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Materialize provided kubeconfig (optional)
        if: env.APISHIM_LIVE_KUBECONFIG_B64 != '' || env.KUBECONFIG_B64 != ''
        run: |
          src="${APISHIM_LIVE_KUBECONFIG_B64:-${KUBECONFIG_B64:-}}"
          if [ -z "$src" ]; then
            exit 0
          fi
          echo "$src" | base64 -d > /tmp/live-kubeconfig
          echo "APISHIM_LIVE_KUBECONFIG=/tmp/live-kubeconfig" >> $GITHUB_ENV
      - name: Run live OpenAPI gate
        env:
          APISHIM_LIVE_KUBECONFIG: ${{ env.APISHIM_LIVE_KUBECONFIG }}
        run: bash scripts/ci/apishim-live-openapi.sh
      - name: Upload live OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apishim-live-openapi-${{ matrix.target }}-${{ matrix.runtime }}
          path: /tmp/apishim-live
      - name: Show logs on failure
        if: failure()
        run: |
          find /tmp -name "shim.log" -print -exec cat {} \; || true
