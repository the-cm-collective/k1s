name: apishim-live-openapi

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/openapi/**"
      - "API-COMPAT.md"
      - ".github/workflows/apishim-live-openapi.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "docs/openapi/**"
      - "API-COMPAT.md"
      - ".github/workflows/apishim-live-openapi.yml"

jobs:
  live-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_PASSWORD: shim
          POSTGRES_USER: shim
          POSTGRES_DB: shim
        options: >-
          --health-cmd "pg_isready -U shim -d shim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AE_APISHIM_DSN: postgresql://shim:shim@localhost:5432/shim
      AE_STATE_DSN: postgresql://shim:shim@localhost:5432/shim
      APISHIM_LIVE_ARTIFACT_DIR: /tmp/apishim-live
      APISHIM_LIVE_RUNTIME: stub
      APISHIM_LIVE_TOKEN: live-ci
      APISHIM_LIVE_NAMESPACE: apishim-live
      APISHIM_KIND_CLUSTER: ${{ vars.APISHIM_KIND_CLUSTER }}
      APISHIM_LIVE_KUBECONFIG_B64: ${{ secrets.APISHIM_LIVE_KUBECONFIG_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Install helm
        run: |
          curl -L https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          chmod +x /usr/local/bin/helm
      - name: Install kind (optional)
        run: |
          curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind
      - name: Materialize provided kubeconfig (optional)
        if: env.APISHIM_LIVE_KUBECONFIG_B64 != ''
        run: |
          echo "$APISHIM_LIVE_KUBECONFIG_B64" | base64 -d > /tmp/live-kubeconfig
          echo "APISHIM_LIVE_KUBECONFIG=/tmp/live-kubeconfig" >> $GITHUB_ENV
      - name: Run live OpenAPI gate
        env:
          APISHIM_LIVE_KUBECONFIG: ${{ env.APISHIM_LIVE_KUBECONFIG }}
        run: bash scripts/ci/apishim-live-openapi.sh
      - name: Upload live OpenAPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apishim-live-openapi
          path: /tmp/apishim-live
      - name: Show logs on failure
        if: failure()
        run: |
          find /tmp -name "shim.log" -print -exec cat {} \; || true
