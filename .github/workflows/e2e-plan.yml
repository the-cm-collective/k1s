name: e2e-plan-legacy

on:
  workflow_dispatch: {}

concurrency:
  group: e2e-plan-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      AE_RUNTIME_BACKEND: docker
      DOCKER_BUILDKIT: 1
      API_PORT: 9108
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - name: Configure Docker client (insecure TLS fallback)
        run: |
          if [ -S /var/run/docker.sock ]; then
            echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_VERIFY=0" >> "$GITHUB_ENV"
            echo "DOCKER_CERT_PATH=" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_CERTDIR=" >> "$GITHUB_ENV"
          elif [ -d /certs/client ]; then
            echo "DOCKER_HOST=tcp://docker:2376" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_VERIFY=0" >> "$GITHUB_ENV"
            echo "DOCKER_CERT_PATH=/certs/client" >> "$GITHUB_ENV"
            echo "DOCKER_TLS_CERTDIR=" >> "$GITHUB_ENV"
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >-
            ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'setup.cfg', 'setup.py', 'requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system deps (age, sops)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y age sops

      - name: Install project deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run E2E /plan validations
        run: bash ./scripts/e2e/plan_validate.sh

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-plan-artifacts
          path: |
            artifacts
