name: helm-dryrun-openapi

on:
  push:
  pull_request:
    paths:
      - "src/**"
      - "scripts/helm_shim_demo.sh"
      - ".github/workflows/helm-dryrun-openapi.yml"

jobs:
  openapi-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Validate OpenAPI snapshots
        run: scripts/validate-openapi.sh

  dryrun:
    runs-on: ubuntu-latest
    needs: openapi-drift
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -e .[dev]
      - name: Install kubectl
        run: |
          curl -L https://dl.k8s.io/release/v1.30.3/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: Install helm
        run: |
          curl -L https://get.helm.sh/helm-v3.14.4-linux-amd64.tar.gz -o /tmp/helm.tgz
          tar -xzf /tmp/helm.tgz -C /tmp
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          chmod +x /usr/local/bin/helm
      - name: Start apishim (stub runtime)
        env:
          AE_APISHIM_ENABLE: "1"
          AE_APISHIM_TOKEN: "ci-token"
          AE_RUNTIME_BACKEND: "stub"
          PYTHONPATH: "src"
        run: |
          python -m ae.apishim serve --host 127.0.0.1 --port 8445 --token "$AE_APISHIM_TOKEN" >/tmp/apishim-openapi.log 2>&1 &
          echo $! >/tmp/apishim.pid
          sleep 3
      - name: Render chart and dry-run server apply
        env:
          TOKEN: "ci-token"
        run: |
          set -euo pipefail
          WORKDIR=$(mktemp -d /tmp/helm-dryrun-XXXX)
          helm create "$WORKDIR/chart" >/dev/null
          K="kubectl --server=http://127.0.0.1:8445 --token=$TOKEN --insecure-skip-tls-verify"
          $K get --raw /openapi/v2 >/tmp/openapi.json
          helm template demo "$WORKDIR/chart" > /tmp/chart.yaml
          $K apply --dry-run=server --validate=false -f /tmp/chart.yaml
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== apishim ===" && cat /tmp/apishim-openapi.log || true
      - name: Stop shim
        if: always()
        run: |
          if [ -f /tmp/apishim.pid ]; then kill $(cat /tmp/apishim.pid) 2>/dev/null || true; fi
