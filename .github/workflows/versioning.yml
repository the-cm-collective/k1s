name: versioning-guard

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate versioning
        run: python scripts/check_versioning.py
