name: versioning-guard

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Trust Gitea cert (or disable verify)
        id: trust-gitea
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
            echo "git_ssl_cainfo=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_OUTPUT"
            echo "git_ssl_no_verify=" >> "$GITHUB_OUTPUT"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
            echo "git_ssl_cainfo=" >> "$GITHUB_OUTPUT"
            echo "git_ssl_no_verify=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: ${{ steps.trust-gitea.outputs.git_ssl_no_verify }}
          GIT_SSL_CAINFO: ${{ steps.trust-gitea.outputs.git_ssl_cainfo }}
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: "3.11"
      - name: Validate versioning
        run: python scripts/check_versioning.py
