name: publish-python-testpypi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build
        required: true
        type: string

concurrency:
  group: publish-python-testpypi-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1793664000"

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      source-sha: ${{ steps.identity.outputs.source_sha }}
      source-tree: ${{ steps.identity.outputs.source_tree }}
      artifact-name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.18"
      - name: Record immutable source identity
        id: identity
        run: |
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "artifact_name=k1s-core-python-$source_sha" >> "$GITHUB_OUTPUT"
      - name: Install pinned build tooling
        run: >-
          python -m pip install
          "build==1.2.2.post1"
          "packaging==26.3"
          "pyproject-hooks==1.3.3"
          "setuptools==80.9.0"
          "twine==6.2.0"
          "wheel==0.45.1"
      - name: Prepare the reviewed runtime wheel closure
        run: |
          python scripts/prepare_release_wheelhouse.py \
            --requirements-lock "$GITHUB_WORKSPACE/requirements-release.lock" \
            --source-contract "$GITHUB_WORKSPACE/requirements-release-sources.json" \
            --wheelhouse "$RUNNER_TEMP/k1s-core-wheelhouse"
      - name: Build and verify the canonical publication bundle
        run: |
          set -euo pipefail
          evidence_parent="$RUNNER_TEMP/k1s-artifact-evidence"
          install -d -m 0700 "$evidence_parent"
          python scripts/build_python_artifacts.py build \
            --repository "$GITHUB_WORKSPACE" \
            --commit "${{ steps.identity.outputs.source_sha }}" \
            --tree "${{ steps.identity.outputs.source_tree }}" \
            --git "$(command -v git)" \
            --python "$(command -v python)" \
            --runtime-wheelhouse "$RUNNER_TEMP/k1s-core-wheelhouse" \
            --requirements-lock "$GITHUB_WORKSPACE/requirements-release.lock" \
            --output-root "$evidence_parent/build" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Attest exact publication bundle
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-path: |
            ${{ runner.temp }}/k1s-artifact-evidence/build/bundle/dist/*.whl
            ${{ runner.temp }}/k1s-artifact-evidence/build/bundle/dist/*.tar.gz
            ${{ runner.temp }}/k1s-artifact-evidence/build/bundle/artifact-manifest.json
            ${{ runner.temp }}/k1s-artifact-evidence/build/bundle/SHA256SUMS
            ${{ runner.temp }}/k1s-artifact-evidence/build/bundle/manifests/*.jsonl
      - name: Upload exact publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/k1s-artifact-evidence/build/bundle

  publish-testpypi:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/k1s-core
    permissions:
      attestations: read
      id-token: write
      contents: read
    steps:
      - name: Check out the exact built source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download exact publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: bundle
      - name: Verify exact publication bytes
        run: |
          python scripts/build_python_artifacts.py verify \
            --repository "$GITHUB_WORKSPACE" \
            --commit "${{ needs.build.outputs.source-sha }}" \
            --tree "${{ needs.build.outputs.source-tree }}" \
            --git "$(command -v git)" \
            --python "$(command -v python)" \
            --bundle-root "$GITHUB_WORKSPACE/bundle" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_github_attestations.py
          --bundle-root bundle
          --repository "$GITHUB_REPOSITORY"
      - name: Publish exact bundle to TestPyPI with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: bundle/dist
          repository-url: https://test.pypi.org/legacy/
