name: publish-python-testpypi

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to build
        required: true
        type: string

concurrency:
  group: publish-python-testpypi-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  SOURCE_DATE_EPOCH: "1793664000"

jobs:
  build:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      source-sha: ${{ steps.identity.outputs.source_sha }}
      artifact-name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Record immutable source identity
        id: identity
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=k1s-core-python-$source_sha" >> "$GITHUB_OUTPUT"
      - name: Install pinned build tooling
        run: python -m pip install "build==1.2.2.post1"
      - name: Download the reviewed runtime wheel closure
        run: >-
          python -m pip download
          --only-binary=:all:
          --require-hashes
          --dest "$RUNNER_TEMP/k1s-core-wheelhouse"
          -r requirements-release.lock
      - name: Build wheel and source distribution once
        run: python -m build --sdist --wheel --outdir dist
      - name: Normalize source distribution container metadata
        run: >-
          python scripts/normalize_python_sdist.py
          --epoch "$SOURCE_DATE_EPOCH"
          dist/*.tar.gz
      - name: Validate identity, namespace, and exact bytes
        run: >-
          python scripts/validate_python_artifacts.py
          --dist dist
          --write-manifest SHA256SUMS
      - name: Prove the installed artifact offline outside the checkout
        env:
          PIP_CONFIG_FILE: /dev/null
          PIP_NO_INDEX: "1"
        run: >-
          python scripts/validate_installed_python_artifact.py
          --wheel dist/*.whl
          --wheelhouse "$RUNNER_TEMP/k1s-core-wheelhouse"
          --requirements-lock requirements-release.lock
          --work-root "$RUNNER_TEMP/k1s-core-artifact-smoke"
          --expected-version "$(python -c 'from pathlib import Path; from scripts.project_version import read_project_version; print(read_project_version(Path("pyproject.toml")))')"
      - name: Attest exact publication bundle
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
      - name: Upload exact publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS

  publish-testpypi:
    if: ${{ github.server_url == 'https://github.com' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/k1s-core
    permissions:
      attestations: read
      id-token: write
      contents: read
    steps:
      - name: Check out the exact built source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.source-sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Download exact publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: bundle
      - name: Verify exact publication bytes
        run: >-
          python scripts/validate_python_artifacts.py
          --dist bundle/dist
          --verify-manifest bundle/SHA256SUMS
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify bundle/dist/*.whl --repo "$GITHUB_REPOSITORY"
          gh attestation verify bundle/dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
          gh attestation verify bundle/SHA256SUMS --repo "$GITHUB_REPOSITORY"
      - name: Publish exact bundle to TestPyPI with OIDC
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: bundle/dist
          repository-url: https://test.pypi.org/legacy/
