name: podman-compat

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  podman-flows:
    runs-on: ubuntu-latest
    steps:
      - name: Trust Gitea cert (or disable verify)
        run: |
          if [ -n "${GITEA_CA_B64:-}" ]; then
            echo "$GITEA_CA_B64" | base64 -d > "$RUNNER_TEMP/gitea-ca.crt"
            git config --global http."https://gitea.core.home.arpa/".sslCAInfo "$RUNNER_TEMP/gitea-ca.crt"
            echo "GIT_SSL_CAINFO=$RUNNER_TEMP/gitea-ca.crt" >> "$GITHUB_ENV"
          else
            git config --global http."https://gitea.core.home.arpa/".sslVerify false
            echo "GIT_SSL_NO_VERIFY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Create venv (local act)
        if: ${{ env.ACT == 'true' && env.GITEA_ACTIONS != 'true' }}
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          . .venv/bin/activate
          python -m pip install -U pip
      - uses: actions/setup-python@v5
        if: ${{ env.ACT != 'true' || env.GITEA_ACTIONS == 'true' }}
        with:
          python-version: '3.12'
      - name: Install Podman
        if: ${{ env.ACT != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Install deps
        run: |
          python -m pip install -e .[dev]
      - name: Podman quick sanity
        if: ${{ env.ACT != 'true' }}
        env:
          AE_RUNTIME_BACKEND: podman
        run: |
          podman info >/dev/null 2>&1 || true
          # no container ops required; ensure CLI works with podman backend selected
          python -m ae.cli k8s-check -f specs/examples/echo.yaml --policy strict
          python -m ae.cli export-k8s -f specs/examples/echo.yaml --validate >/dev/null
          python -m ae.cli plan -f specs/examples/echo.yaml --json >/dev/null
      - name: L4 docs present
        run: |
          test -f docs/guides/l4-services.md
      - name: StatefulSet export smoke
        if: ${{ env.ACT != 'true' }}
        run: |
          python -m ae.cli export-k8s -f specs/examples/echo.yaml --workload statefulset --validate >/dev/null
