apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: k1s-nfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: k1s.io/nfs
parameters:
  server: 10.0.0.10
  path: /exports/k1s
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
mountOptions:
  - vers=4.2
  - rsize=1048576
  - wsize=1048576
