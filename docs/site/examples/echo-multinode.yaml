apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: echo-mn
spec:
  image: mendhak/http-https-echo:37
  replicas: 2
  env:
    - name: APP_NAME
      value: echo-mn
    - name: MESSAGE
      value: "Hello from multi-node"
  ports:
    - name: http
      containerPort: 8080
  service:
    port: 8080
    targetPort: 8080
  ingress:
    host: echo-mn.home.arpa
    path: /
  health:
    readiness:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 1
      timeoutSeconds: 1
      periodSeconds: 5
      successThreshold: 1
      failureThreshold: 3
    liveness:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 3
      timeoutSeconds: 1
      periodSeconds: 10
      successThreshold: 1
      failureThreshold: 3
  resources:
    requests:
      cpu: 0.05
      memory: 128Mi
  security:
    runAsUser: 1000
    readOnlyRootFilesystem: true
    dropCapabilities: ["NET_RAW"]
    seccompProfileType: RuntimeDefault
