apiVersion: ae.dev/v1alpha1
kind: App
metadata:
  name: echo-hardened
spec:
  image: mendhak/http-https-echo:37
  replicas: 2
  env:
    - name: APP_NAME
      value: echo-hardened
  ports:
    - name: http
      containerPort: 8080
  service:
    port: 80
    targetPort: 8080
  health:
    readiness:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 2
      timeoutSeconds: 1
      periodSeconds: 5
    liveness:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      timeoutSeconds: 1
      periodSeconds: 10
      failureThreshold: 3
    startup:
      httpGet:
        path: /
        port: 8080
      failureThreshold: 30
      periodSeconds: 5
  resources:
    requests:
      cpu: 0.1
      memory: 128Mi
    limits:
      cpu: 0.5
      memory: 256Mi
  security:
    runAsUser: 1000
    readOnlyRootFilesystem: true
    dropCapabilities: ["NET_RAW"]
    seccompProfileType: RuntimeDefault
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: echo-hardened
  ingress:
    host: echo-hardened.home.arpa
    path: /
  networkPolicy:
    policyTypes: ["Ingress", "Egress"]
    # Default deny with explicit egress allowances for DNS and web
    ingress: []
    egress:
      - to:
          - ipBlock: { cidr: 0.0.0.0/0 }
        ports:
          - { protocol: UDP, port: 53 }
          - { protocol: TCP, port: 53 }
          - { protocol: TCP, port: 80 }
          - { protocol: TCP, port: 443 }
  exportHints:
    emitPDB: true
    suppressImageMultiArchWarning: true
