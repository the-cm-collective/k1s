apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sea-netfs-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: k1s-nfs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: netfs-nfs-sea-edge-02-edge-1
spec:
  image: busybox:1.36
  replicas: 1
  command: ["sh", "-c", "echo netfs-from-sea > /data/hello.txt; sleep 3600"]
  pvcMounts:
    - claimName: sea-netfs-pvc
      mountPath: /data
  nodeSelector:
    role: gateway
    site: sea-edge-02
    node_id: sea-edge-02--edge-1
