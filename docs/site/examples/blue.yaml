apiVersion: ae.dev/v1alpha1
kind: App
metadata:
  name: blue
spec:
  image: demo-blue:latest
  replicas: 1
  env:
    - name: APP_NAME
      value: blue
    - name: MESSAGE
      value: "Hello from blue"
  ports:
    - name: http
      containerPort: 8080
  ingress:
    host: blue.home.arpa
    path: /
