apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: echo-del
spec:
  image: alpine:3.20
  command: ["sh", "-c", "while true; do date >> /var/lib/echo/data.log; sleep 1; done"]
  replicas: 1
  ports:
    - name: http
      containerPort: 8080
  storage:
    - name: data
      mountPath: /var/lib/echo
      retention: Delete
---
apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: echo-rollout
spec:
  image: mendhak/http-https-echo:37
  replicas: 1
  ports:
    - { name: http, containerPort: 8080 }
  health:
    readiness: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 1 }
  rollout: { strategy: ordered, maxSurge: 1, maxUnavailable: 0 }
  env:
    - { name: APP_MODE, value: demo-override-2 }
